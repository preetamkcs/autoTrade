<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Trading App</h1>

    <div id="auth-section">
        <h2>Login</h2>
        <p>Click the button below to login and generate a session.</p>
        <button id="login-button">Login with Kite</button>
    </div>

    <div id="strategies-section">
        <h2>Available Strategies</h2>
        <ul id="strategies-list">
            <!-- Strategies will be loaded here dynamically -->
        </ul>
        <button id="load-strategies-button">Load Strategies</button>
    </div>

    <div id="app"></div>

    <script src="js/app.js"></script>
</body>
</html>
