# =======================================================================================
#  DANGER: DO NOT HARDCODE YOUR CREDENTIALS HERE
#  For production, it is strongly recommended to use environment variables or a secure
#  configuration server to manage sensitive information like API keys and database
#  credentials.
# =======================================================================================

# Zerodha Kite Connect API Configuration (use environment variables for production)
kite.api.key=${KITE_API_KEY:YOUR_API_KEY}
kite.api.secret=${KITE_API_SECRET:YOUR_API_SECRET}
kite.request.token=${KITE_REQUEST_TOKEN:YOUR_REQUEST_TOKEN}

# Database Configuration (use environment variables for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:YOUR_DB_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080